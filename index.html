
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeAlpha Hangman Game</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef2ff;
  color: #172554;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
}
.container {
  width: 100%;
  max-width: 700px;
  background: white;
  border-radius: 20px;
  padding: 28px;
  box-shadow: 0 12px 35px #1e293b20;
  text-align: center;
}
.student {
  background: #eff6ff;
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 22px;
  text-align: left;
  line-height: 1.8;
}
h1 { color: #1d4ed8; margin-bottom: 8px; }
.subtitle { color: #64748b; }
#drawing {
  width: 190px;
  height: 210px;
  margin: 12px auto;
}
g.part { display: none; }
.word {
  display: flex;
  justify-content: center;
  gap: 9px;
  flex-wrap: wrap;
  margin: 22px 0;
}
.letter {
  width: 34px;
  height: 42px;
  border-bottom: 3px solid #2563eb;
  font-size: 25px;
  font-weight: bold;
}
.keyboard {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 7px;
  margin: 20px 0;
}
.keyboard button {
  width: 42px;
  height: 42px;
  border: 0;
  border-radius: 8px;
  background: #dbeafe;
  color: #1e40af;
  font-weight: bold;
  cursor: pointer;
}
.keyboard button:hover:not(:disabled) { background: #93c5fd; }
.keyboard button:disabled { opacity: .4; cursor: not-allowed; }
#message { min-height: 28px; font-weight: bold; }
.actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.actions button {
  padding: 12px 18px;
  border: 0;
  border-radius: 9px;
  cursor: pointer;
  font-weight: bold;
}
#newGame { background: #2563eb; color: white; }
#hint { background: #e0e7ff; color: #3730a3; }
footer { margin-top: 24px; color: #64748b; font-size: 13px; }
</style>
</head>
<body>
<main class="container">
  <section class="student">
    <strong>Student Name:</strong> AADITYA KUMAR<br>
    <strong>Course:</strong> B.TECH (CSE)<br>
    <strong>College:</strong> IIMT COLLEGE OF ENGINEERING<br>
    <strong>Project:</strong> CodeAlpha Hangman Game
  </section>

  <h1>Hangman Game</h1>
  <p class="subtitle">Guess the hidden word, one letter at a time!</p>

  <svg id="drawing" viewBox="0 0 190 210" aria-label="Hangman drawing">
    <g fill="none" stroke="#334155" stroke-width="5" stroke-linecap="round">
      <path d="M20 195 H150 M55 195 V15 H130 V38"/>
    </g>
    <g class="part" fill="none" stroke="#dc2626" stroke-width="4">
      <circle cx="130" cy="55" r="17"/>
    </g>
    <g class="part" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round">
      <path d="M130 72 V125"/>
    </g>
    <g class="part" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round">
      <path d="M130 85 L105 108"/>
    </g>
    <g class="part" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round">
      <path d="M130 85 L155 108"/>
    </g>
    <g class="part" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round">
      <path d="M130 125 L108 158"/>
    </g>
    <g class="part" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round">
      <path d="M130 125 L152 158"/>
    </g>
  </svg>

  <p>Attempts remaining: <strong id="attempts">6</strong> / 6</p>
  <div class="word" id="word"></div>
  <div class="keyboard" id="keyboard"></div>
  <p id="message" aria-live="polite">Choose a letter to begin.</p>

  <div class="actions">
    <button id="hint">Show Hint</button>
    <button id="newGame">New Game</button>
  </div>
  <p id="hintText"></p>

  <footer>CodeAlpha Project | Developed by AADITYA KUMAR</footer>
</main>

<script>
const words = [
  { word: "apple", hint: "A fruit that can be red or green." },
  { word: "mango", hint: "A tropical fruit often called the king of fruits." },
  { word: "kitten", hint: "A young cat." },
  { word: "penguin", hint: "A flightless bird that swims." },
  { word: "elephant", hint: "A very large animal with a trunk." },
  { word: "computer", hint: "An electronic device used for computing." },
  { word: "javascript", hint: "A programming language used on websites." },
  { word: "college", hint: "An institution for higher education." }
];

let answer = "";
let guessed = [];
let remaining = 6;
let finished = false;
let currentHint = "";

const wordEl = document.getElementById("word");
const keyboardEl = document.getElementById("keyboard");
const attemptsEl = document.getElementById("attempts");
const messageEl = document.getElementById("message");
const hintTextEl = document.getElementById("hintText");
const parts = document.querySelectorAll("#drawing .part");

function newGame() {
  const entry = words[Math.floor(Math.random() * words.length)];
  answer = entry.word;
  currentHint = entry.hint;
  guessed = [];
  remaining = 6;
  finished = false;
  messageEl.textContent = "Choose a letter to begin.";
  hintTextEl.textContent = "";
  render();
}

function render() {
  wordEl.innerHTML = "";
  for (const letter of answer) {
    const span = document.createElement("span");
    span.className = "letter";
    span.textContent = guessed.includes(letter) || finished ? letter : "";
    wordEl.appendChild(span);
  }

  keyboardEl.innerHTML = "";
  for (let code = 65; code <= 90; code++) {
    const letter = String.fromCharCode(code).toLowerCase();
    const button = document.createElement("button");
    button.textContent = letter.toUpperCase();
    button.disabled = guessed.includes(letter) || finished;
    button.setAttribute("aria-label", letter);
    button.addEventListener("click", () => guess(letter));
    keyboardEl.appendChild(button);
  }

  attemptsEl.textContent = remaining;
  parts.forEach((part, index) => {
    part.style.display = index < 6 - remaining ? "block" : "none";
  });
}

function guess(letter) {
  if (finished || guessed.includes(letter)) return;

  guessed.push(letter);

  if (!answer.includes(letter)) {
    remaining--;
    messageEl.textContent = "Not quite! Try another letter.";
  } else {
    messageEl.textContent = "Good guess!";
  }

  if ([...answer].every(char => guessed.includes(char))) {
    finished = true;
    messageEl.textContent = "🎉 You won! The word was " + answer + ".";
  } else if (remaining === 0) {
    finished = true;
    messageEl.textContent = "Game over! The word was " + answer + ".";
  }

  render();
}

document.addEventListener("keydown", event => {
  const key = event.key.toLowerCase();
  if (/^[a-z]$/.test(key)) guess(key);
});

document.getElementById("hint").addEventListener("click", () => {
  if (!finished) hintTextEl.textContent = "Hint: " + currentHint;
});

document.getElementById("newGame").addEventListener("click", newGame);

newGame();
</script>
</body>
</html>
